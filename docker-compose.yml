version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mathsy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meet24
      POSTGRES_DB: mathsy_meet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
    driver: local
